<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>TEQ PREMIUM BOT — Secure Access</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--text:#f4f7ff;--muted:#a9b5c9;--line:rgba(255,255,255,.13);--blue:#55aaff;--deep:#07111f}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);min-height:100vh;padding:24px 16px;background:linear-gradient(180deg,rgba(4,10,20,.30),rgba(4,10,20,.96)),url('/static/cpm-premium-hero.png') center/cover fixed no-repeat;display:flex;align-items:center;justify-content:center}
.wrap{width:100%;max-width:440px}.brand{text-align:center;font-size:1.65rem;font-weight:900;letter-spacing:.08em;text-shadow:0 3px 24px #000;margin-bottom:7px}.sub{text-align:center;color:#d5e3f7;font-size:.9rem;margin-bottom:22px}.card{background:rgba(7,15,29,.88);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 20px 70px #0009;backdrop-filter:blur(18px)}.eyebrow{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:#7fc3ff;font-weight:800;margin-bottom:8px}.heading{font-size:1.35rem;font-weight:800;margin-bottom:6px}.desc{font-size:.82rem;color:var(--muted);margin-bottom:20px;line-height:1.5}.tabs{display:flex;gap:7px;background:#050d19;padding:5px;border-radius:13px;margin-bottom:18px}.tab{flex:1;border:0;background:transparent;color:var(--muted);font-weight:700;padding:12px 8px;border-radius:10px;cursor:pointer}.tab.on{background:linear-gradient(135deg,#248ce8,#1553a8);color:white;box-shadow:0 5px 18px #1679d955}.field{margin-bottom:13px}input{width:100%;background:#071322;border:1px solid var(--line);border-radius:12px;padding:15px;color:var(--text);font-size:16px;outline:none}input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #55aaff20}input::placeholder{color:#77879d}.pass-wrap{position:relative}.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:0;color:#8fcaff;font-weight:700;cursor:pointer}.btn{width:100%;border:0;border-radius:12px;padding:15px;margin-top:5px;font-weight:800;font-size:.98rem;cursor:pointer;color:white;background:linear-gradient(135deg,#238de9,#164c9d);box-shadow:0 9px 25px #1268bc55}.btn:disabled{opacity:.65}.err{color:#ffb4b4;font-size:.82rem;text-align:center;margin-top:13px;min-height:1.2em}.hint{text-align:center;color:#a9b5c9;font-size:.73rem;margin-top:16px;line-height:1.5}.secure{text-align:center;color:#a9b5c9;font-size:.72rem;margin-top:15px}
</style></head><body><main class="wrap"><div class="brand">TEQ PREMIUM BOT</div><div class="sub">Your CPM1 tools. One secure place.</div><section class="card"><div class="eyebrow">Member access</div><div class="heading" id="heading">Welcome back</div><div class="desc" id="desc">Sign in with your Car Parking Multiplayer account to continue.</div><div class="tabs"><button type="button" class="tab on" id="tabL">Login</button><button type="button" class="tab" id="tabR">Create Account</button></div><form id="form"><div class="field"><input type="email" id="email" placeholder="Email address" required autocomplete="username"/></div><div class="field pass-wrap"><input type="password" id="pass" placeholder="Password" required autocomplete="current-password"/><button type="button" class="eye" id="eye">Show</button></div><button type="submit" class="btn" id="go">Sign In</button><div class="err" id="err" role="status"></div></form><div class="secure">🔒 Secure Telegram Mini App session</div></section><p class="hint">Open this page using the Open App button in your TEQ PREMIUM BOT Telegram chat.</p></main>
<script>
const tg=window.Telegram&&window.Telegram.WebApp;if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#07111f');tg.setBackgroundColor('#07111f')}catch(e){}}let mode='login';const tabL=document.getElementById('tabL'),tabR=document.getElementById('tabR'),go=document.getElementById('go');function setMode(m){mode=m;tabL.classList.toggle('on',m==='login');tabR.classList.toggle('on',m==='register');go.textContent=m==='login'?'Sign In':'Create Account';document.getElementById('heading').textContent=m==='login'?'Welcome back':'Create your account';document.getElementById('desc').textContent=m==='login'?'Sign in with your Car Parking Multiplayer account to continue.':'Create your CPM1 account to get started.';document.getElementById('pass').autocomplete=m==='login'?'current-password':'new-password';document.getElementById('err').textContent=''}tabL.onclick=()=>setMode('login');tabR.onclick=()=>setMode('register');document.getElementById('eye').onclick=()=>{const i=document.getElementById('pass');i.type=i.type==='password'?'text':'password';document.getElementById('eye').textContent=i.type==='password'?'Show':'Hide'};function tgUser(){const initData=(tg&&tg.initData)||'';let tg_id=null,username='',first_name='',last_name='';if(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user){const u=tg.initDataUnsafe.user;tg_id=u.id;username=u.username||'';first_name=u.first_name||'';last_name=u.last_name||''}return{initData,tg_id,username,first_name,last_name}}document.getElementById('form').onsubmit=async e=>{e.preventDefault();const err=document.getElementById('err'),email=document.getElementById('email').value.trim(),password=document.getElementById('pass').value,u=tgUser();if(!u.initData&&!u.tg_id){err.textContent='Open this page from your Telegram bot → Open App';return}go.disabled=true;err.style.color='#a9d7ff';err.textContent=mode==='login'?'Signing in…':'Creating your account…';try{const res=await fetch(mode==='login'?'/api/cpm_login':'/api/cpm_register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password,...u})});const data=await res.json();if(data.ok){location.href='/app'}else{let m=data.error||data.message||'Unable to continue';if(String(m).includes('EMAIL_EXISTS'))m='This email is already registered. Please sign in.';if(String(m).toLowerCase().includes('load'))m='Profile setup needs another login attempt. Please try signing in.';err.style.color='#ffb4b4';err.textContent=m}}catch(ex){err.style.color='#ffb4b4';err.textContent='Connection error. Please try again.'}finally{go.disabled=false}};
</script></body></html>
